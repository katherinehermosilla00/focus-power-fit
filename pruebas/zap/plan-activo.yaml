# Escaneo ACTIVO de OWASP ZAP (Automation Framework) sobre el entorno QA.
# Ataca de verdad la aplicación: usar SOLO contra el entorno QA desechable,
# nunca contra el sistema real. Instrucciones en pruebas/README.md.
# Requiere la variable TOKEN_ADMIN con un token del administrador QA.
env:
  contexts:
    - name: focus-qa
      urls:
        - https://host.docker.internal:8443
      includePaths:
        - https://host.docker.internal:8443.*
      excludePaths:
        - https://host.docker.internal:8443/_next/static/.*
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  # Todas las peticiones llevan la sesión del administrador QA.
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: Sesion del administrador QA
        matchType: req_header
        matchString: Authorization
        matchRegex: false
        replacementString: Bearer ${TOKEN_ADMIN}

  # Rutas de la API que el spider no descubre solo (la API no tiene enlaces).
  - type: requestor
    requests:
      - url: https://host.docker.internal:8443/health
      - url: https://host.docker.internal:8443/api/sucursales
      - url: https://host.docker.internal:8443/api/sucursales/admin
      - url: https://host.docker.internal:8443/api/clientes
      - url: https://host.docker.internal:8443/api/planes
      - url: https://host.docker.internal:8443/api/profesores
      - url: https://host.docker.internal:8443/api/profesores/publicos
      - url: https://host.docker.internal:8443/api/horarios
      - url: https://host.docker.internal:8443/api/asignaciones
      - url: https://host.docker.internal:8443/api/asistencias
      - url: https://host.docker.internal:8443/api/pagos
      - url: https://host.docker.internal:8443/api/contratos
      - url: https://host.docker.internal:8443/api/recordatorios
      - url: https://host.docker.internal:8443/api/maquinas
      - url: https://host.docker.internal:8443/api/maquinas/1
      - url: https://host.docker.internal:8443/api/contratos/1/archivo
      - url: https://host.docker.internal:8443/api/auth/login
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"email":"zap@focuspowerfit.test","password":"ClaveZap-2026"}'
      - url: https://host.docker.internal:8443/api/auth/password/forgot
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"email":"zap@focuspowerfit.test"}'
      - url: https://host.docker.internal:8443/api/planes
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"nombre":"Plan ZAP","descripcion":"Plan ficticio","duracionMeses":1,"sesiones":4,"precio":1000,"modalidad":"Individual"}'
      - url: https://host.docker.internal:8443/api/planes/1
        method: PUT
        headers:
          - "Content-Type: application/json"
        data: '{"descripcion":"Descripcion editada por ZAP"}'
      - url: https://host.docker.internal:8443/api/clientes
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"nombre":"Cliente ZAP","email":"cliente.zap@focuspowerfit.test","rut":"11.111.111-1","sucursalId":1}'
      - url: https://host.docker.internal:8443/api/horarios
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"profesorId":1,"diaSemana":"Domingo","horaInicio":"06:00","horaFin":"07:00","modalidad":"Individual"}'
      - url: https://host.docker.internal:8443/api/recordatorios
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"clienteId":1,"tipo":"Otro","titulo":"Recordatorio ZAP","mensaje":"Mensaje ficticio","fechaEnvio":"2099-01-01T10:00:00"}'
      - url: https://host.docker.internal:8443/api/fitbot/chat
        method: POST
        headers:
          - "Content-Type: application/json"
        data: '{"chatInput":"horarios","sessionId":"3f2b8c1e-4a5d-4e6f-9a7b-1c2d3e4f5a6b"}'

  - type: spider
    parameters:
      context: focus-qa
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: activeScan
    parameters:
      context: focus-qa
      maxScanDurationInMins: 30
      maxRuleDurationInMins: 3
      threadPerHost: 4

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap-activo.html
      reportTitle: Focus Power Fit - Escaneo activo OWASP ZAP
    risks: [info, low, medium, high]
    confidences: [falsepositive, low, medium, high, confirmed]

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-activo.json
    risks: [info, low, medium, high]
    confidences: [falsepositive, low, medium, high, confirmed]
