
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: focus-power-fit-n8n
    restart: unless-stopped

    ports:
      - "5679:5678"

    environment:
      - TZ=America/Santiago
      - GENERIC_TIMEZONE=America/Santiago
      - N8N_SECURE_COOKIE=false

      # Configuracion de acceso local
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http

      # URL del editor y webhooks
      - N8N_EDITOR_BASE_URL=http://localhost:5679
      - WEBHOOK_URL=http://localhost:5679/

    volumes:
      - focus_n8n_data:/home/node/.n8n

volumes:
  focus_n8n_data:
