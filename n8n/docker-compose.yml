services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: focus-power-fit-n8n
    restart: unless-stopped

    ports:
      - "5679:5678"

    environment:
      - TZ=America/Santiago
      - GENERIC_TIMEZONE=America/Santiago
      - N8N_SECURE_COOKIE=false

    volumes:
      - focus_n8n_data:/home/node/.n8n

volumes:
  focus_n8n_data: